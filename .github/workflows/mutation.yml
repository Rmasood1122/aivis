name: mutation
on:
  workflow_dispatch:

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov mutmut
      - name: Baseline suite must be green
        run: pytest -q
      - name: Mutation run
        run: mutmut run
      - name: Results
        run: |
          mutmut results
          mutmut junitxml > mutmut.xml || true
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: mutmut.xml
